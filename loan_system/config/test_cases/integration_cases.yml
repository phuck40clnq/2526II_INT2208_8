# Integration test cases - end-to-end flow: validate -> risk -> decide


# INVALID INPUT — validation should reject before decision
invalid_input:
  - id: INT-INV-01
    desc: "Age below minimum"
    age: 17
    income: 20.0
    credit_score: 750
    employment: C
    expected: INVALID
    error: "Invalid age"

  - id: INT-INV-02
    desc: "Income above maximum"
    age: 30
    income: 500.1
    credit_score: 750
    employment: C
    expected: INVALID
    error: "Invalid income"

  - id: INT-INV-03
    desc: "Credit score above maximum"
    age: 30
    income: 20.0
    credit_score: 851
    employment: C
    expected: INVALID
    error: "Invalid credit score"

  - id: INT-INV-04
    desc: "Invalid employment code"
    age: 30
    income: 20.0
    credit_score: 750
    employment: X
    expected: INVALID
    error: "Invalid employment"


# APPROVE
approve:
  - id: INT-APP-01
    desc: "income=15.0, LOW risk, Contract"
    age: 30
    income: 15.0
    credit_score: 750
    employment: C
    expected: APPROVE

  - id: INT-APP-02
    desc: "income=500.0, MEDIUM risk, Contract"
    age: 30
    income: 500.0
    credit_score: 600
    employment: C
    expected: APPROVE

  - id: INT-APP-03
    desc: "All minimum-boundary valid fields, income>=15"
    age: 18
    income: 15.0
    credit_score: 701
    employment: C
    expected: APPROVE


# MANUAL REVIEW
manual_review:
  - id: INT-MR-01
    desc: "income=14.9, LOW risk, Contract"
    age: 30
    income: 14.9
    credit_score: 750
    employment: C
    expected: MANUAL REVIEW

  - id: INT-MR-02
    desc: "income>=15, LOW risk, Freelance"
    age: 30
    income: 20.0
    credit_score: 750
    employment: F
    expected: MANUAL REVIEW

  - id: INT-MR-03
    desc: "income>=15, MEDIUM risk, Freelance"
    age: 30
    income: 15.0
    credit_score: 600
    employment: F
    expected: MANUAL REVIEW


# REJECT
reject:
  - id: INT-REJ-01
    desc: "HIGH risk"
    age: 30
    income: 20.0
    credit_score: 300
    employment: C
    expected: REJECT

  - id: INT-REJ-02
    desc: "HIGH risk"
    age: 30
    income: 20.0
    credit_score: 500
    employment: F
    expected: REJECT

  - id: INT-REJ-03
    desc: "income<15, MEDIUM risk, Contract"
    age: 30
    income: 10.0
    credit_score: 600
    employment: C
    expected: REJECT

  - id: INT-REJ-04
    desc: "income<15, LOW risk, Freelance"
    age: 30
    income: 10.0
    credit_score: 750
    employment: F
    expected: REJECT

  - id: INT-REJ-05
    desc: "income=5.0, MEDIUM risk, Freelance"
    age: 30
    income: 5.0
    credit_score: 600
    employment: F
    expected: REJECT